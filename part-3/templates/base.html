<html>

<head>
    <title>Part 3 - Flask-SQLAlchemy ORM</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f0f4f8; }
        h1 { color: #2c3e50; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        table { border-collapse: collapse; width: 100%; background: white; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #9b59b6; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .btn { display: inline-block; padding: 8px 16px; text-decoration: none; border-radius: 4px; margin: 2px; }
        .btn-add { background: #27ae60; color: white; padding: 12px 24px; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        .flash { padding: 15px; margin: 15px 0; border-radius: 4px; }
        .flash.success { background: #d4edda; color: #155724; }
        .flash.danger { background: #f8d7da; color: #721c24; }
        .empty { color: #888; font-style: italic; }
        .course-badge { background: #9b59b6; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
        .course-card { background: white; padding: 20px; margin: 15px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .course-card h3 { margin: 0 0 10px 0; color: #9b59b6; }
        .course-card p { color: #666; margin: 5px 0; }
        .student-count { background: #9b59b6; color: white; padding: 4px 12px; border-radius: 12px; font-size: 14px; }
        .btn { display: inline-block; padding: 12px 24px; background: #27ae60; color: white; text-decoration: none; border-radius: 4px; }
        .flash { padding: 15px; margin: 15px 0; border-radius: 4px; }
        .flash.success { background: #d4edda; color: #155724; }
    </style>
     
</head>

<body>
    <h1>Student & Teacher Management Page (Part 3 - SQLAlchemy ORM)</h1>

    <nav>
        <a href="{{ url_for('index') }}">Students</a>
        <a href="{{ url_for('courses') }}">Courses</a>
        <a href="{{ url_for('teachers') }}">Teachers</a>
       
    </nav>

         {% block content %}
        <!-- Page content goes here -->
        {% endblock %}
</body>
</html>
