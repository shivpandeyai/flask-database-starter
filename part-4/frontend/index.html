<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        h1 { color: var(--primary); text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 25px; cursor: pointer; border: none; background: var(--secondary); color: white; border-radius: 4px; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); }

        .form-section { background: #f9f9f9; padding: 20px; border-radius: 5px; margin-bottom: 30px; border: 1px solid #ddd; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button.submit-btn { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button.submit-btn:hover { background: #219150; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: var(--primary); color: white; }
        tr:hover { background: #f1f1f1; }

        .hidden { display: none; }
        .action-btn { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; margin-right: 5px; }
        .edit-btn { background: green; color: white; }
        .delete-btn { background: #e74c3c; color: white; }
         /* Modal Styling */
        .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6); /* Semi-transparent background */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        }
        .modal-content {
        background: white;
        padding: 30px;
        border-radius: 8px;
        width: 400px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .hidden { display: none !important; } /* Ensure hidden works */
    </style>

</head>
<body>

<div class="container">
    <h1>Author & Book Management Dashboard</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="showSection('author-section', this)">Authors</button>
        <button class="tab-btn" onclick="showSection('book-section', this)">Books</button>
    </div>

    <div id="author-section">
        <div class="form-section">
            <h3>Add New Author</h3>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="auth-name" placeholder="e.g. Dr. Aris Thorne">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" id="auth-city" placeholder="e.g. San Francisco">
            </div>
            <div class="form-group">
                <label>Bio</label>
                <textarea id="auth-bio" rows="3" placeholder="Short biography..."></textarea>
            </div>
            <button class="submit-btn" onclick="addAuthor()">Create Author</button>
        </div>

        <h3>Registered Authors</h3>
        <table id="author-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Bio</th>
                    <th>City</th>
                    <th>Actions
                        
                </td>
                    </th>
                </tr>
            </thead>
            <tbody id="author-list">
                </tbody>
        </table>
    </div>

    <div id="book-section" class="hidden">
        <div class="form-section">
            <h3>Add New Book</h3>
            <div class="form-group">
                <label>Book Title</label>
                <input type="text" id="book-title" placeholder="e.g. Deep Learning Architectures">
            </div>
            <div class="form-group">
                <label>Assign Author</label>
                <select id="book-author-id">
                    <option value="">-- Select an Author --</option>
                    </select>
            </div>
            <div class="form-group">
                <label>Year</label>
                <input type="number" id="book-year" placeholder="2024">
            </div>
            <div class="form-group">
                <label>ISBN</label>
                <input type="text" id="book-isbn" placeholder="978-3-16-148410-0">
            </div>
            <button class="submit-btn" onclick="addBook()">Register Book</button>
        </div>

        <h3>Book Catalog</h3>
        <table id="book-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Year</th>
                    <th>ISBN</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="book-list">
                </tbody>
        </table>
    </div>
</div>

<!-- Link your external JavaScript file here -->
    <script src="code.js"></script>

<script>
    // Logic for toggling sections
    function showSection(sectionId, btn) {
        document.getElementById('author-section').classList.add('hidden');
        document.getElementById('book-section').classList.add('hidden');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(sectionId).classList.remove('hidden');
        btn.classList.add('active');
    }
</script>

          <!-- Modal for editing entries -->

<div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 id="modal-title">Edit Entry</h2>
        <hr>
        
        <input type="hidden" id="edit-id">
        <input type="hidden" id="edit-type">

        <div id="edit-author-fields" class="hidden">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="edit-auth-name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="edit-auth-email">
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" id="edit-auth-city">
            </div>
            <div class="form-group">
                <label>Bio</label>
                <textarea id="edit-auth-bio" rows="3"></textarea>
            </div>
        </div>

        <div id="edit-book-fields" class="hidden">
            <div class="form-group">
                <label>Book Title</label>
                <input type="text" id="edit-book-title">
            </div>
            <div class="form-group">
                <label>Year</label>
                <input type="number" id="edit-book-year">
            </div>
            <div class="form-group">
                <label>ISBN</label>
                <input type="text" id="edit-book-isbn">
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="submit-btn" onclick="saveEdit()">Save Changes</button>
            <button class="tab-btn" style="background: #95a5a6;" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

</body>

</html>
